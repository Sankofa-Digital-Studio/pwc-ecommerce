name: CI

on:
  pull_request:
    branches:
      - dev
      - preview
      - main
  push:
    branches:
      - dev
      - preview
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dependencies:check
      - run: npm run images:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:run
      - run: npm run build
      - name: Build static Storybook
        run: npm run build-storybook
      - name: Cypress homepage smoke
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b
        with:
          start: npm run dev
          wait-on: http://127.0.0.1:3000
          browser: chrome

  supabase-baseline:
    name: Supabase M0 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Confirm repository-pinned Supabase CLI
        run: npm run supabase:version
      - name: Validate migrations, access boundaries and booking conflicts
        run: npm run supabase:m0:ci
